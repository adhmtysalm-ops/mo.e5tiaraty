<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  body { margin: 0; background: #9a9a96; font: 12px sans-serif; }
  canvas { image-rendering: pixelated; background: #fff; }
  .wrap { padding: 16px; display: flex; gap: 24px; }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <img id="src" src="favicon.svg" width="16" height="16"/>
      <div>16 source</div>
    </div>
    <div>
      <canvas id="c" width="256" height="256"></canvas>
      <div>16 × 16 nearest 16×</div>
    </div>
    <div>
      <img src="favicon.svg" width="128" height="128" style="background:#141414"/>
      <div>128</div>
    </div>
  </div>
  <script>
    const img = document.getElementById("src");
    const c = document.getElementById("c");
    const ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    function draw() {
      const off = document.createElement("canvas");
      off.width = 16; off.height = 16;
      const o = off.getContext("2d");
      o.drawImage(img, 0, 0, 16, 16);
      ctx.drawImage(off, 0, 0, 256, 256);
    }
    img.decode ? img.decode().then(draw) : img.onload = draw;
    if (img.complete) draw();
  </script>
</body>
</html>
